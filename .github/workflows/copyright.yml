name: Copyright
on: [push, pull_request]
permissions:
  contents: read
jobs:
  copyright:
    name: Check copyright headers
    uses: web-eid/.github/.github/workflows/copyright.yml@9ea5bd0c816309493524bce9f96024ed3cc6ff1d # main
    with:
      # JSON manifests have no comment syntax; src/ui/translations/*.ts are Qt
      # translation sources that lupdate rewrites, not TypeScript
      exclude: (\.json\.cmake$|^src/ui/translations/)
