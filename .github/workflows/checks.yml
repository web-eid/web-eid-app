name: Checks
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  checks:
    uses: web-eid/.github/.github/workflows/checks.yml@703c7dcfa986e75514c048c8310e8e5c6b1820e8 # main
    with:
      # JSON manifests have no comment syntax; src/ui/translations/*.ts are Qt
      # translation sources that lupdate rewrites, not TypeScript
      exclude: (\.json\.cmake$|^src/ui/translations/)
