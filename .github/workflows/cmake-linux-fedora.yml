name: CMake (Fedora Linux)

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_NUMBER: ${{github.run_number}}
  CMAKE_BUILD_PARALLEL_LEVEL: 3

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container: fedora:${{ matrix.container }}
    strategy:
      matrix:
        container: [44, 45]

    steps:
      - name: Install Deps
        run: dnf install -y --setopt=install_weak_deps=False git gcc-c++ cmake rpm-build openssl-devel pcsc-lite-devel qt6-qtsvg-devel qt6-qttools-devel gtest-devel

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configure CMake
        run: cmake --preset default -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_SYSCONFDIR=/etc

      - name: Build
        run: cmake --build --preset default --target package

      - name: Test
        run: ctest --preset default

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-eid-app-fedora-build-fedora${{matrix.container}}-${{github.run_number}}
          path: build/Linux/*rpm
