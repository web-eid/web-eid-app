name: CMake (macOS)

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_NUMBER: ${{github.run_number}}
  CMAKE_BUILD_PARALLEL_LEVEL: 3

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Cache vcpkg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: ${{ runner.os }}-${{ runner.arch }}-vcpkg-${{ hashFiles('lib/libelectronic-id/vcpkg.json', '.github/vcpkg-triplets/arm64-x64-osx.cmake') }}

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: 6.12.1
          arch: clang_64
          cache: true

      - name: Configure
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite
        run: |
          export VCPKG_ROOT="${VCPKG_INSTALLATION_ROOT}"
          cmake --preset macos-universal -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: |
          cmake --build --preset macos-universal
          cmake --build --preset macos-universal --target installer
          cmake --build --preset macos-universal --target installer-safari

      - name: Test
        run: ctest --preset macos-universal

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-eid-app-macos-build-${{github.run_number}}
          path: |
            build/Darwin-universal/src/app/*.pkg
            build/Darwin-universal/src/app/*.dmg
